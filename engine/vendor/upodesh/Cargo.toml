# Vendored copy of upodesh 0.4.0 (https://github.com/OpenBangla/upodesh, MIT)
# with Lekho's fixes; see PATCHES.md. Wired in via [patch.crates-io] in
# engine/Cargo.toml so riti uses it.
[package]
name = "upodesh"
version = "0.4.0"
edition = "2021"
rust-version = "1.63.0"
license = "MIT"
description = "A Rust library for generating Bengali word suggestions based on a given input string."
repository = "https://github.com/OpenBangla/upodesh"
publish = false

[dependencies]
fst = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "~1.20" # For maintaining MSRV

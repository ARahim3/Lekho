[package]
name = "avrobangla-engine"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "avrobangla_engine"
crate-type = ["staticlib"]

[dependencies]
riti = { git = "https://github.com/OpenBangla/riti.git" }

# riti's dictionary search crate, patched: 0.4.0 can't find দ্ধ words
# (মুক্তিযোদ্ধা, যুদ্ধ, বুদ্ধি), word-initial ঐ/ঔ, and a few more. Drop this once
# upstream ships the fixes. Details: vendor/upodesh/PATCHES.md
[patch.crates-io]
upodesh = { path = "vendor/upodesh" }
